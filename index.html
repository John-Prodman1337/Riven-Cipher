<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riven Cipher — Warframe Riven Guesser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --c-bg:#07090e;--c-surface:#0d1118;--c-surface2:#111720;
    --c-border:#1a2535;--c-border2:#243040;
    --c-text:#b8c8e0;--c-muted:#445566;
    --c-accent:#00b4ff;--c-gold:#f0a020;
    --c-pos:#3af;--c-neg:#f64;--c-ok:#0ef0a0;
  }
  html,body{min-height:100vh;background:var(--c-bg);font-family:'Rajdhani',sans-serif;color:var(--c-text);}
  body{display:flex;flex-direction:column;align-items:center;padding:0 0 4rem;}

  /* ── Header ── */
  .site-header{width:100%;max-width:580px;padding:2.5rem 1.5rem 0;text-align:center;}
  .site-title{font-family:'Orbitron',monospace;font-size:clamp(22px,5vw,30px);font-weight:900;letter-spacing:6px;color:var(--c-accent);text-transform:uppercase;margin-bottom:4px;display:inline-block;}
  .site-title::after{content:'';display:block;height:1px;background:linear-gradient(90deg,transparent,var(--c-accent),transparent);margin-top:6px;opacity:.5;}
  .site-sub{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--c-muted);margin-top:8px;}

  /* ── Nav tabs ── */
  .nav-tabs{display:flex;gap:1px;background:var(--c-border);border:1px solid var(--c-border);border-radius:8px;overflow:hidden;max-width:580px;width:calc(100% - 3rem);margin:1.5rem auto 0;}
  .nav-tab{flex:1;background:var(--c-surface);padding:10px 8px;text-align:center;font-family:'Orbitron',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--c-muted);cursor:pointer;transition:background .15s,color .15s;border:none;}
  .nav-tab:hover{color:var(--c-text);}
  .nav-tab.active{background:var(--c-surface2);color:var(--c-accent);}

  /* ── Stats bar ── */
  .stats-bar{display:flex;gap:1px;background:var(--c-border);border:1px solid var(--c-border);border-radius:8px;overflow:hidden;max-width:580px;width:calc(100% - 3rem);margin:1rem auto 0;}
  .stat-cell{flex:1;background:var(--c-surface);padding:10px 8px;text-align:center;}
  .stat-cell .val{font-family:'Orbitron',monospace;font-size:18px;font-weight:700;color:var(--c-accent);line-height:1;}
  .stat-cell .lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--c-muted);margin-top:3px;}

  /* ── Timer bar ── */
  .timer-wrap{max-width:580px;width:calc(100% - 3rem);margin:.75rem auto 0;}
  .timer-row{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .timer-val{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;color:var(--c-gold);min-width:48px;}
  .timer-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--c-muted);}
  .timer-track{flex:1;height:4px;background:var(--c-surface2);border-radius:2px;overflow:hidden;}
  .timer-fill{height:100%;border-radius:2px;background:var(--c-gold);transition:width .1s linear,background .3s;}

  /* ── Progress row ── */
  .progress-row{display:flex;justify-content:center;gap:5px;margin:.75rem auto 0;max-width:580px;width:calc(100% - 3rem);}
  .pdot{flex:1;height:4px;border-radius:2px;background:var(--c-surface2);border:1px solid var(--c-border);transition:background .3s,box-shadow .3s;}
  .pdot.current{background:var(--c-accent);box-shadow:0 0 8px rgba(0,180,255,.6);}
  .pdot.done-correct{background:var(--c-ok);}
  .pdot.done-wrong{background:var(--c-neg);}

  .main{max-width:580px;width:calc(100% - 3rem);margin:1.25rem auto 0;}

  /* ── Mod card ── */
  .mod-card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:12px;padding:1.25rem 1.25rem 1rem;position:relative;overflow:hidden;margin-bottom:1.25rem;}
  .mod-card::before{content:'';position:absolute;inset:0;border-radius:12px;border-top:2px solid transparent;background:linear-gradient(var(--c-surface),var(--c-surface)) padding-box,linear-gradient(90deg,transparent 10%,var(--c-accent) 50%,transparent 90%) border-box;pointer-events:none;}
  .mod-card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.75rem;}
  .weapon-info{flex:1;}
  .weapon-type-badge{display:inline-block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--c-muted);border:1px solid var(--c-border);border-radius:3px;padding:1px 6px;margin-bottom:4px;}
  .weapon-name{font-family:'Orbitron',monospace;font-size:15px;font-weight:700;color:#e0eaff;letter-spacing:1px;}
  .mod-name{font-size:11px;letter-spacing:2px;color:var(--c-accent);text-transform:uppercase;margin-top:3px;opacity:.8;}
  .polarity-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .polarity-badge{width:38px;height:38px;border:1px solid var(--c-border2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:15px;color:var(--c-accent);background:var(--c-surface2);}
  .dispo-bar{display:flex;gap:2px;}
  .dispo-pip{width:6px;height:6px;border-radius:50%;background:var(--c-border2);border:1px solid var(--c-border);}
  .dispo-pip.on{background:var(--c-gold);border-color:var(--c-gold);}
  .rank-row{display:flex;gap:4px;margin-bottom:1rem;}
  .rank-dot{width:7px;height:7px;border-radius:50%;background:var(--c-border2);border:1px solid var(--c-border);}
  .rank-dot.on{background:var(--c-gold);border-color:var(--c-gold);box-shadow:0 0 5px rgba(240,160,0,.5);}

  .stat-slots{border-top:1px solid var(--c-border);padding-top:.75rem;}
  .stat-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .stat-sign{width:24px;height:24px;border-radius:4px;border:1px solid var(--c-border);background:var(--c-surface2);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:13px;font-weight:700;flex-shrink:0;}
  .stat-sign.pos{color:var(--c-pos);border-color:#1a3a55;}
  .stat-sign.neg{color:var(--c-neg);border-color:#402010;}
  .stat-sign.unk{color:var(--c-muted);}
  .stat-pill{flex:1;height:30px;border-radius:5px;border:1px solid var(--c-border);background:var(--c-surface2);display:flex;align-items:center;padding:0 10px;font-size:13px;font-weight:600;letter-spacing:.5px;color:#333d4d;overflow:hidden;}
  .stat-pill.hidden-anim{background:repeating-linear-gradient(90deg,var(--c-surface2) 0,var(--c-surface2) 6px,var(--c-border) 6px,var(--c-border) 7px);background-size:14px 100%;animation:scan 3s linear infinite;}
  @keyframes scan{from{background-position:0 0}to{background-position:280px 0}}
  .stat-pill.revealed.pos{color:var(--c-pos);border-color:#1a3a55;background:#06131f;}
  .stat-pill.revealed.neg{color:var(--c-neg);border-color:#40200a;background:#180a02;}
  .stat-pill.unknown{color:var(--c-muted);font-style:italic;font-size:12px;}
  .neg-hint{font-size:10px;letter-spacing:1px;color:var(--c-muted);font-style:italic;}

  /* ── Speed bonus flash ── */
  .speed-flash{text-align:center;font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px;color:var(--c-gold);min-height:16px;margin-bottom:4px;}

  /* ── Question area ── */
  .q-area{margin-top:0;}
  .q-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--c-muted);text-align:center;margin-bottom:.6rem;}
  .name-hint{text-align:center;margin-bottom:1rem;padding:10px 14px;background:var(--c-surface2);border:1px solid var(--c-border);border-radius:6px;}
  .nh-row{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;}
  .nh-sep{color:var(--c-muted);font-size:14px;}
  .nh-token{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .nh-word{font-family:'Orbitron',monospace;font-size:13px;color:#e0eaff;letter-spacing:1px;}
  .nh-word.asking{color:var(--c-accent);border-bottom:1px solid var(--c-accent);}
  .nh-word.answered{color:var(--c-ok);}
  .nh-role{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--c-muted);}
  .nh-role.asking{color:var(--c-accent);}
  .q-prompt{text-align:center;font-family:'Orbitron',monospace;font-size:13px;color:#e0eaff;letter-spacing:1px;margin-bottom:1rem;}
  .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:1rem;}
  .opt-btn{background:var(--c-surface2);border:1px solid var(--c-border2);border-radius:6px;padding:9px 12px;color:#8898b0;font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.5px;transition:border-color .12s,background .12s,color .12s,transform .1s;text-align:center;line-height:1.3;}
  .opt-btn:hover:not(:disabled){border-color:var(--c-accent);color:var(--c-accent);background:rgba(0,180,255,.06);}
  .opt-btn:active:not(:disabled){transform:scale(.97);}
  .opt-btn.correct-ans{border-color:var(--c-ok)!important;color:var(--c-ok)!important;background:rgba(0,240,160,.07)!important;}
  .opt-btn.wrong-ans{border-color:var(--c-neg)!important;color:var(--c-neg)!important;background:rgba(255,100,40,.07)!important;}
  .opt-btn:disabled{cursor:default;opacity:.7;}
  .feedback{text-align:center;font-family:'Orbitron',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;min-height:20px;margin-bottom:.75rem;}
  .feedback.correct{color:var(--c-ok);}
  .feedback.wrong{color:var(--c-neg);}
  .next-btn{display:block;width:100%;background:transparent;border:1px solid var(--c-accent);border-radius:6px;padding:12px;color:var(--c-accent);font-family:'Orbitron',monospace;font-size:11px;letter-spacing:4px;text-transform:uppercase;cursor:pointer;transition:background .15s,transform .1s;}
  .next-btn:hover{background:rgba(0,180,255,.08);}
  .next-btn:active{transform:scale(.98);}

  /* ── Results ── */
  .results-screen{text-align:center;padding:1.5rem 0 2rem;}
  .results-title{font-family:'Orbitron',monospace;font-size:14px;letter-spacing:4px;text-transform:uppercase;color:var(--c-muted);margin-bottom:.5rem;}
  .results-score{font-family:'Orbitron',monospace;font-size:56px;font-weight:900;color:#e0eaff;line-height:1;margin:.5rem 0;}
  .results-sub{font-size:14px;color:var(--c-muted);letter-spacing:1px;margin-bottom:.4rem;}
  .results-grade{font-family:'Orbitron',monospace;font-size:13px;color:var(--c-accent);letter-spacing:2px;margin-bottom:1.5rem;}
  .results-breakdown{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:1.5rem;}
  .breakdown-cell{background:var(--c-surface);border:1px solid var(--c-border);border-radius:6px;padding:8px 4px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--c-muted);}
  .breakdown-cell .bval{font-family:'Orbitron',monospace;font-size:16px;font-weight:700;display:block;margin-bottom:3px;}
  .breakdown-cell.correct-cell .bval{color:var(--c-ok);}
  .breakdown-cell.wrong-cell .bval{color:var(--c-neg);}
  .breakdown-cell.score-cell .bval{color:var(--c-accent);}
  .breakdown-cell.streak-cell .bval{color:var(--c-gold);}
  .breakdown-cell.time-cell .bval{color:#c080ff;}
  .category-results{text-align:left;margin-bottom:1.5rem;}
  .cat-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--c-muted);margin-bottom:.75rem;}
  .cat-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;font-weight:600;}
  .cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .cat-dot.c{background:var(--c-ok);}
  .cat-dot.w{background:var(--c-neg);}
  .cat-weapon{flex:1;color:var(--c-text);}
  .cat-result{font-family:'Orbitron',monospace;font-size:11px;}
  .cat-result.c{color:var(--c-ok);}
  .cat-result.w{color:var(--c-neg);}

  /* ── Name entry ── */
  .name-entry{background:var(--c-surface);border:1px solid var(--c-border);border-radius:10px;padding:1.25rem;margin-bottom:1.25rem;}
  .name-entry-title{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--c-muted);margin-bottom:.75rem;text-align:center;}
  .name-input-row{display:flex;gap:8px;}
  .name-input{flex:1;background:var(--c-surface2);border:1px solid var(--c-border2);border-radius:5px;padding:9px 12px;color:var(--c-text);font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:600;letter-spacing:1px;outline:none;}
  .name-input:focus{border-color:var(--c-accent);}
  .name-input::placeholder{color:var(--c-muted);}
  .submit-btn{background:var(--c-accent);border:none;border-radius:5px;padding:9px 18px;color:#000;font-family:'Orbitron',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-weight:700;transition:opacity .15s;}
  .submit-btn:hover{opacity:.85;}
  .submit-btn:disabled{opacity:.4;cursor:default;}
  .name-status{font-size:11px;letter-spacing:1px;color:var(--c-muted);text-align:center;margin-top:.5rem;min-height:16px;}

  /* ── Leaderboard ── */
  .leaderboard-wrap{max-width:580px;width:calc(100% - 3rem);margin:1.25rem auto 0;}
  .lb-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
  .lb-title{font-family:'Orbitron',monospace;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--c-accent);}
  .lb-sub{font-size:11px;letter-spacing:1px;color:var(--c-muted);}
  .lb-refresh{background:transparent;border:1px solid var(--c-border);border-radius:4px;padding:5px 10px;color:var(--c-muted);font-family:'Rajdhani',sans-serif;font-size:11px;letter-spacing:1px;cursor:pointer;transition:border-color .12s,color .12s;}
  .lb-refresh:hover{border-color:var(--c-accent);color:var(--c-accent);}
  .lb-list{display:flex;flex-direction:column;gap:5px;}
  .lb-row{display:flex;align-items:center;gap:10px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:7px;padding:10px 14px;}
  .lb-row.lb-mine{border-color:#1a3a55;background:#060f18;}
  .lb-row.lb-top{border-color:#3a3000;background:#0e0a00;}
  .lb-rank{font-family:'Orbitron',monospace;font-size:12px;font-weight:700;color:var(--c-muted);min-width:24px;text-align:center;}
  .lb-rank.gold{color:var(--c-gold);}
  .lb-rank.silver{color:#aab;}
  .lb-rank.bronze{color:#c8824a;}
  .lb-name{flex:1;font-size:14px;font-weight:600;color:var(--c-text);letter-spacing:.5px;}
  .lb-score{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;color:var(--c-accent);}
  .lb-correct{font-size:11px;color:var(--c-muted);letter-spacing:1px;}
  .lb-time{font-size:11px;color:#c080ff;letter-spacing:1px;}
  .lb-empty{text-align:center;padding:2rem;font-size:13px;color:var(--c-muted);letter-spacing:2px;text-transform:uppercase;}
  .lb-loading{text-align:center;padding:2rem;font-family:'Orbitron',monospace;font-size:11px;color:var(--c-muted);letter-spacing:2px;animation:pulse 1.5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

  /* ── Legend ── */
  .aux-wrap{max-width:580px;width:calc(100% - 3rem);margin:1rem auto 0;}
  .legend-toggle{display:block;width:100%;background:transparent;border:1px solid var(--c-border);border-radius:6px;padding:9px 14px;color:var(--c-muted);font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-bottom:.75rem;text-align:left;transition:border-color .12s,color .12s;}
  .legend-toggle:hover{border-color:var(--c-accent);color:var(--c-accent);}
  .legend-panel{background:var(--c-surface);border:1px solid var(--c-border);border-radius:8px;padding:1rem;margin-bottom:1.5rem;display:none;}
  .legend-panel.open{display:block;}
  .legend-section-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--c-accent);margin-bottom:.5rem;}
  .legend-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;}
  .legend-row{display:flex;gap:6px;align-items:baseline;font-size:12px;padding:3px 0;border-bottom:1px solid var(--c-border);}
  .legend-row:last-child{border-bottom:none;}
  .legend-token{font-family:'Orbitron',monospace;font-size:11px;color:var(--c-accent);min-width:50px;}
  .legend-stat{color:var(--c-text);}
</style>
</head>
<body>

<header class="site-header">
  <h1 class="site-title">Riven Cipher</h1>
  <p class="site-sub">Decode the hidden stats from the void</p>
</header>

<div class="nav-tabs">
  <button class="nav-tab active" onclick="switchTab('game')" id="tab-game">Play</button>
  <button class="nav-tab" onclick="switchTab('leaderboard')" id="tab-lb">Leaderboard</button>
</div>

<!-- GAME TAB -->
<div id="pane-game">
  <div class="stats-bar">
    <div class="stat-cell"><div class="val" id="s-score">0</div><div class="lbl">Score</div></div>
    <div class="stat-cell"><div class="val" id="s-streak">0</div><div class="lbl">Streak</div></div>
    <div class="stat-cell"><div class="val" id="s-round">1 / 10</div><div class="lbl">Round</div></div>
    <div class="stat-cell"><div class="val" id="s-correct">0</div><div class="lbl">Correct</div></div>
  </div>

  <div class="timer-wrap" id="timer-wrap">
    <div class="timer-row">
      <span class="timer-label">Speed</span>
      <div class="timer-track"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
      <span class="timer-val" id="timer-val">10.0s</span>
    </div>
  </div>

  <div class="progress-row" id="progress-row"></div>
  <main class="main" id="main"></main>
</div>

<!-- LEADERBOARD TAB -->
<div id="pane-lb" style="display:none;">
  <div class="leaderboard-wrap">
    <div class="lb-header">
      <div>
        <div class="lb-title">Daily Leaderboard</div>
        <div class="lb-sub" id="lb-period">Last 24 hours</div>
      </div>
      <button class="lb-refresh" onclick="loadLeaderboard()">↻ Refresh</button>
    </div>
    <div class="lb-list" id="lb-list"><div class="lb-loading">Loading...</div></div>
  </div>
</div>

<!-- AUX (legend) always visible -->
<div class="aux-wrap" id="aux-wrap">
  <button class="legend-toggle" onclick="document.getElementById('lgp').classList.toggle('open')">⊞ Token Reference</button>
  <div class="legend-panel" id="lgp"></div>
</div>

<script>
// ── Token tables ──────────────────────────────────────────────
// Attack Speed is melee-only and shares the same token as Fire Rate
// (Croni for Base, Dra for End). They are intentionally identical in
// the name — the game shows the contextually correct label per weapon type.
const BASE = {
  "Ammo Maximum":"Ampi","Damage to Corpus":"Manti","Damage to Grineer":"Argi",
  "Damage to Infested":"Pura","Cold Damage":"Geli","Critical Chance":"Crita",
  "Critical Damage":"Acri","Base Damage":"Visi","Electricity Damage":"Vexi",
  "Heat Damage":"Igni","Fire Rate":"Croni","Projectile Flight Speed":"Conci",
  "Impact Damage":"Magna","Magazine Capacity":"Arma","Multishot":"Sati",
  "Toxin Damage":"Toxi","Punch Through":"Lexi","Puncture Damage":"Insi",
  "Reload Speed":"Feva","Slash Damage":"Sci","Status Chance":"Hexa",
  "Status Duration":"Deci","Weapon Recoil":"Zeti","Zoom":"Hera",
  // Melee-only — same token as Fire Rate (Croni)
  "Attack Speed":"Croni",
  "Combo Duration":"Croni","Initial Combo":"Exi",
  "Melee Range":"Locti","Finisher Damage":"Exi","Heavy Attack Efficiency":"Tempi",
  "Heavy Attack Wind Up":"Noxi","Slide Critical Chance":"Pleci",
};
const END = {
  "Ammo Maximum":"Bin","Damage to Corpus":"Tron","Damage to Grineer":"Con",
  "Damage to Infested":"Ada","Cold Damage":"Do","Critical Chance":"Cron",
  "Critical Damage":"Tis","Base Damage":"Ata","Electricity Damage":"Tio",
  "Heat Damage":"Pha","Fire Rate":"Dra","Projectile Flight Speed":"Nak",
  "Impact Damage":"Ton","Magazine Capacity":"Tin","Multishot":"Can",
  "Toxin Damage":"Tox","Punch Through":"Nok","Puncture Damage":"Cak",
  "Reload Speed":"Tak","Slash Damage":"Sus","Status Chance":"Dex",
  "Status Duration":"Des","Weapon Recoil":"Mag","Zoom":"Lis",
  // Melee-only — same token as Fire Rate (Dra)
  "Attack Speed":"Dra",
  "Combo Duration":"Dra","Initial Combo":"Ion",
  "Melee Range":"Tin","Finisher Damage":"Dex","Heavy Attack Efficiency":"Nem",
  "Heavy Attack Wind Up":"Lis","Slide Critical Chance":"Dex",
};

// Ranged weapons never get Attack Speed; melee weapons never get Fire Rate.
// When building the option pool, swap out the inapplicable alias so players
// are always choosing between stats that could actually appear on that weapon.
const MELEE_TYPES = new Set([
  "Heavy Blade","Dual Blades","Nikana","Scythe","Polearm",
  "Whip","Zaw","Dagger","Gunblade","Two-Handed Nikana","Sword","Sparring",
  "Hammer","Glaive","Claws","Tonfas","Machete","Rapier","Blade and Whip",
]);

function statPoolForRiven(slotIdx, riven) {
  const isMelee = MELEE_TYPES.has(riven.type);
  const base = slotIdx < 2 ? Object.keys(BASE) : Object.keys(END);
  // Remove the alias that doesn't apply to this weapon class
  return base.filter(s => isMelee ? s !== "Fire Rate" : s !== "Attack Speed");

// ── Timer config ──────────────────────────────────────────────
const QUESTION_TIME = 10; // seconds per question
const SPEED_BONUS_MAX = 150; // max extra points for instant answer

// ── Game state ────────────────────────────────────────────────
let G={};
let timerInterval=null;
let questionStartTime=0;

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function makeOptions(correct,pool,exclude){
  const others=pool.filter(s=>s!==correct&&!exclude.includes(s));
  return shuffle([correct,...shuffle(others).slice(0,3)]);
}

function initGame(){
  clearInterval(timerInterval);
  G={pool:shuffle(RIVEN_DB).slice(0,10),round:0,qIdx:0,score:0,streak:0,bestStreak:0,results:[],totalTime:0,speedBonusTotal:0};
  updateStats(); renderProgress(); renderRound();
}

function updateStats(){
  document.getElementById('s-score').textContent=G.score;
  document.getElementById('s-streak').textContent=G.streak;
  document.getElementById('s-round').textContent=(G.round+1)+' / 10';
  document.getElementById('s-correct').textContent=G.results.filter(Boolean).length;
}

function renderProgress(){
  const row=document.getElementById('progress-row');
  row.innerHTML='';
  for(let i=0;i<10;i++){
    const d=document.createElement('div');
    d.className='pdot'+(i===G.round?' current':i<G.results.length?(G.results[i]?' done-correct':' done-wrong'):'');
    row.appendChild(d);
  }
}

// ── Timer ─────────────────────────────────────────────────────
function startTimer(){
  clearInterval(timerInterval);
  questionStartTime=Date.now();
  updateTimerUI(QUESTION_TIME);
  timerInterval=setInterval(()=>{
    const elapsed=(Date.now()-questionStartTime)/1000;
    const remaining=Math.max(0,QUESTION_TIME-elapsed);
    updateTimerUI(remaining);
    if(remaining<=0){
      clearInterval(timerInterval);
      // time's up — auto-wrong
      handleAnswer('__timeout__', G.pool[G.round].pos[G.qIdx]);
    }
  },100);
}

function stopTimer(){
  clearInterval(timerInterval);
}

function updateTimerUI(remaining){
  const pct=remaining/QUESTION_TIME;
  const fill=document.getElementById('timer-fill');
  const val=document.getElementById('timer-val');
  if(!fill||!val) return;
  fill.style.width=(pct*100)+'%';
  fill.style.background=pct>0.5?'var(--c-gold)':pct>0.25?'#f08000':'var(--c-neg)';
  val.style.color=pct>0.5?'var(--c-gold)':pct>0.25?'#f08000':'var(--c-neg)';
  val.textContent=remaining.toFixed(1)+'s';
}

function getSpeedBonus(){
  const elapsed=(Date.now()-questionStartTime)/1000;
  const frac=Math.max(0,1-(elapsed/QUESTION_TIME));
  return Math.round(frac*SPEED_BONUS_MAX);
}

function modCardHTML(riven,revealedPosCount){
  const rankDots=Array.from({length:8},(_,i)=>`<div class="rank-dot on"></div>`).join('');
  const dispoPips=Array.from({length:5},(_,i)=>`<div class="dispo-pip ${i<riven.dispo?'on':''}"></div>`).join('');
  let statsHtml='';
  riven.pos.forEach((stat,i)=>{
    const revealed=i<revealedPosCount;
    statsHtml+=`<div class="stat-row"><div class="stat-sign pos">+</div><div class="stat-pill ${revealed?'revealed pos':'hidden-anim'}">${revealed?stat:''}</div></div>`;
  });
  riven.neg.forEach(()=>{
    statsHtml+=`<div class="stat-row"><div class="stat-sign unk">?</div><div class="stat-pill unknown"><span class="neg-hint">negative — not encoded in name</span></div></div>`;
  });
  return `<div class="mod-card">
    <div class="mod-card-header">
      <div class="weapon-info">
        <div class="weapon-type-badge">${riven.type}</div>
        <div class="weapon-name">${riven.weapon}</div>
        <div class="mod-name">${riven.name}</div>
      </div>
      <div class="polarity-wrap">
        <div class="polarity-badge">${riven.polarity}</div>
        <div class="dispo-bar">${dispoPips}</div>
      </div>
    </div>
    <div class="rank-row">${rankDots}</div>
    <div class="stat-slots">${statsHtml}</div>
  </div>`;
}

function nameHintHTML(riven,askingIdx){
  const parts=riven.name.split('-');
  const roles=['weapon','base','base','end'];
  const nodes=parts.map((tok,i)=>{
    const isAsking=i===askingIdx+1;
    const isAnswered=i>0&&i<askingIdx+1;
    return `<div class="nh-token"><span class="nh-word ${isAsking?'asking':isAnswered?'answered':''}">${tok}</span><span class="nh-role ${isAsking?'asking':''}">${roles[i]}</span></div>`;
  });
  const withSeps=nodes.reduce((acc,n,i)=>i===0?[n]:[...acc,`<span class="nh-sep">-</span>`,n],[]);
  return `<div class="name-hint"><div class="nh-row">${withSeps.join('')}</div></div>`;
}

// ── Render round ──────────────────────────────────────────────
function renderRound(){
  const riven=G.pool[G.round];
  const qi=G.qIdx;
  const target=riven.pos[qi];
  const pool=statPoolForRiven(qi,riven);
  const otherPos=riven.pos.filter((_,i)=>i!==qi);
  const options=makeOptions(target,pool,otherPos);
  const safe=s=>s.replace(/'/g,"\\'");
  const optBtns=options.map(o=>`<button class="opt-btn" data-opt="${o}" onclick="handleAnswer('${safe(o)}','${safe(target)}')">${o}</button>`).join('');
  const slotLabel=qi<2?`Base token ${qi+1}`:'End token';

  document.getElementById('main').innerHTML=`
    ${modCardHTML(riven,qi)}
    <div class="q-area">
      <div class="q-label">Identify stat ${qi+1} of 3 — ${slotLabel}</div>
      ${nameHintHTML(riven,qi)}
      <div class="q-prompt">What does this token encode?</div>
      <div class="speed-flash" id="speed-flash"></div>
      <div class="options-grid">${optBtns}</div>
      <div class="feedback" id="feedback"></div>
    </div>`;

  startTimer();
}

function handleAnswer(chosen,correct){
  stopTimer();
  const elapsed=(Date.now()-questionStartTime)/1000;
  G.totalTime+=Math.min(elapsed,QUESTION_TIME);

  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.disabled=true;
    if(b.dataset.opt===correct) b.classList.add('correct-ans');
    else if(b.dataset.opt===chosen&&chosen!==correct) b.classList.add('wrong-ans');
  });

  const isCorrect=chosen!=='__timeout__'&&chosen===correct;
  const fb=document.getElementById('feedback');
  const sf=document.getElementById('speed-flash');

  if(isCorrect){
    G.streak++;
    G.bestStreak=Math.max(G.bestStreak,G.streak);
    const streakBonus=Math.floor(G.streak/3)*50;
    const speedBonus=getSpeedBonus();
    G.speedBonusTotal+=speedBonus;
    const total=100+streakBonus+speedBonus;
    G.score+=total;
    let msg='✓ Correct';
    const extras=[];
    if(streakBonus) extras.push(`+${streakBonus} streak`);
    if(speedBonus)  extras.push(`+${speedBonus} speed`);
    if(extras.length) msg+=`  (${extras.join(', ')})`;
    fb.textContent=msg;
    fb.className='feedback correct';
    if(speedBonus>80) sf.textContent=`⚡ ${speedBonus} speed bonus!`;
  } else {
    G.streak=0;
    fb.textContent=chosen==='__timeout__'?'✗ Time\'s up — '+correct:'✗ Wrong — '+correct;
    fb.className='feedback wrong';
  }
  updateStats();

  const riven=G.pool[G.round];
  const nextQ=G.qIdx+1;
  setTimeout(()=>{
    if(nextQ<3){G.qIdx=nextQ;renderRound();}
    else{G.results.push(isCorrect);renderReveal(riven,isCorrect);}
  },1100);
}

function renderReveal(riven,wasCorrect){
  const isLast=G.round>=9;
  document.getElementById('main').innerHTML=`
    ${modCardHTML(riven,3)}
    <div class="q-area">
      <div class="feedback ${wasCorrect?'correct':'wrong'}" style="margin-bottom:1rem;">${wasCorrect?'✓ All stats decoded':'✗ Incorrect'}</div>
      <button class="next-btn" onclick="advanceRound()">${isLast?'See Results':'Next Mod'} →</button>
    </div>`;
  renderProgress();
}

function advanceRound(){
  if(G.round>=9){showResults();return;}
  G.round++;G.qIdx=0;
  updateStats();renderProgress();renderRound();
}

async function sbFetch(path, opts={}){
  const res = await fetch(SB_URL+'/rest/v1/'+path, {
    ...opts,
    headers:{
      'apikey': SB_KEY,
      'Authorization': 'Bearer '+SB_KEY,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer||'',
      ...(opts.headers||{})
    }
  });
  if(!res.ok){
    const err = await res.text();
    throw new Error(err);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// SHA-256 hash the IP so raw addresses are never stored
async function hashIP(ip){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(ip+'riven-cipher-salt'));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,32);
}

async function getIPHash(){
  try{
    const res = await fetch('https://api.ipify.org?format=json');
    const {ip} = await res.json();
    return await hashIP(ip);
  }catch(e){
    // fallback: hash a random stable value stored in localStorage
    let fid = localStorage.getItem('riven-fid');
    if(!fid){ fid = crypto.randomUUID(); localStorage.setItem('riven-fid',fid); }
    return await hashIP(fid);
  }
}

async function submitScore(){
  const nameEl  = document.getElementById('player-name');
  const statusEl = document.getElementById('name-status');
  const btn      = document.getElementById('submit-btn');
  const username = (nameEl.value||'').trim();
  if(!username){ statusEl.textContent='Enter your Warframe username first.'; return; }

  btn.disabled = true;
  nameEl.disabled = true;
  statusEl.textContent = 'Submitting...';

  const correct  = G.results.filter(Boolean).length;
  const avgTime  = parseFloat((G.totalTime/30).toFixed(2));
  const score    = G.score;

  try{
    const ipHash = await getIPHash();

    // Check if this IP already has an entry in the last 24h
    const cutoff = new Date(Date.now() - 24*60*60*1000).toISOString();
    const existing = await sbFetch(
      `leaderboard?ip_hash=eq.${ipHash}&created_at=gte.${cutoff}&order=score.desc&limit=1`,
      { headers:{ 'Accept':'application/json' } }
    );

    if(existing && existing.length > 0){
      const prev = existing[0];
      if(score <= prev.score){
        // New score isn't better — don't update
        statusEl.innerHTML = `Your best today is already <span style="color:var(--c-accent)">${prev.score}</span> — beat it to update!`;
        nameEl.disabled = false;
        btn.disabled = false;
        return;
      }
      // New score is higher — delete the old entry then insert fresh
      await sbFetch(`leaderboard?id=eq.${prev.id}`, { method:'DELETE', prefer:'' });
    }

    // Insert the new (or first) entry
    await sbFetch('leaderboard', {
      method: 'POST',
      prefer: 'return=minimal',
      body: JSON.stringify({ username, score, correct, avg_time:avgTime, ip_hash:ipHash })
    });

    statusEl.innerHTML = `✓ Submitted as <span style="color:var(--c-accent)">${username}</span>!`;
    document.getElementById('name-entry').style.borderColor='#1a3a55';

  }catch(err){
    console.error(err);
    statusEl.textContent = '✗ Submit failed — check your connection.';
    btn.disabled = false;
    nameEl.disabled = false;
  }
}

  }catch(err){
    console.error(err);
    list.innerHTML='<div class="lb-empty">Failed to load — check connection.</div>';
  }
}

// ── Tab switching ─────────────────────────────────────────────
function switchTab(tab){
  document.getElementById('pane-game').style.display=tab==='game'?'':'none';
  document.getElementById('pane-lb').style.display=tab==='lb'?'':'none';
  document.getElementById('tab-game').classList.toggle('active',tab==='game');
  document.getElementById('tab-lb').classList.toggle('active',tab==='lb');
  if(tab==='lb') loadLeaderboard();
}

// ── Build legend ──────────────────────────────────────────────
(function(){
  const lgp=document.getElementById('lgp');
  // Build Base rows — merge Fire Rate / Attack Speed into one entry
  const baseEntries = Object.entries(BASE)
    .filter(([s]) => s !== "Attack Speed") // skip duplicate, handled below
    .map(([s,t]) => {
      const extra = s === "Fire Rate" ? ' <span style="color:var(--c-muted);font-size:10px">/ Attack Speed</span>' : '';
      return `<div class="legend-row"><span class="legend-token">${t}</span><span class="legend-stat">${s}${extra}</span></div>`;
    }).join('');
  const endEntries = Object.entries(END)
    .filter(([s]) => s !== "Attack Speed")
    .map(([s,t]) => {
      const extra = s === "Fire Rate" ? ' <span style="color:var(--c-muted);font-size:10px">/ Attack Speed</span>' : '';
      return `<div class="legend-row"><span class="legend-token">${t}</span><span class="legend-stat">${s}${extra}</span></div>`;
    }).join('');
  lgp.innerHTML=`
    <div class="legend-section-title" style="margin-bottom:.5rem">Base tokens (stats 1 &amp; 2)</div>
    <div class="legend-cols">${baseEntries}</div>
    <div style="height:1rem"></div>
    <div class="legend-section-title" style="margin-bottom:.5rem">End tokens (stat 3)</div>
    <div class="legend-cols">${endEntries}</div>`;
})();

initGame();
</script>
</body>
</html>
